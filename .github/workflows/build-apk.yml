name: Build RECORBET BATIER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer le SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extraire le projet Android
        run: |
          unzip -q RECORBET_BATIER_V2_TELEPHONE.zip
          test -f RECORBET_BATIER_V2/settings.gradle.kts
          test -f RECORBET_BATIER_V2/app/build.gradle.kts

      - name: Corriger Java et Kotlin en JVM 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("RECORBET_BATIER_V2/app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          if "jvmToolchain(17)" not in s:
              s += """

          kotlin {
              jvmToolchain(17)
          }
          """

          p.write_text(s)
          PY

      - name: Construire l'APK
        run: |
          cd RECORBET_BATIER_V2
          gradle :app:assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: RECORBET-BATIER-V2-APK
          path: RECORBET_BATIER_V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
