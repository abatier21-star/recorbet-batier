name: Build RECORBET BATIER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraire le projet Android
        run: |
          unzip -q RECORBET_BATIER_V2_TELEPHONE.zip
          cd RECORBET_BATIER_V2
          echo "Projet Android extrait"

      - name: Construire l'APK
        run: |
          cd RECORBET_BATIER_V2
          gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: RECORBET-BATIER-V2-APK
          path: RECORBET_BATIER_V2/app/build/outputs/apk/debug/app-debug.apk
